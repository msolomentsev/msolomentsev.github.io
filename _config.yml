title: Michael Solomentsev
# No site-level `description`: on the home page jekyll-seo-tag appends it to the <title>
# (e.g. "Michael Solomentsev | ..."). Set a page-level `description` in each page's
# front matter instead — that feeds <meta name="description"> without touching the title.
show_downloads: false
blogurl:

plugins:
  - jekyll-remote-theme


remote_theme: "jekyll/minima"

author:
  name: Michael Solomentsev

minima:
  skin: dark
  header_pages:
  - index.html
  - blogIndex.md